<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gider Fiş">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1626">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SİNETECHNİC GİDER</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,sans-serif;background:#0e1626;color:#e8edf5}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:#121c30;border-bottom:3px solid #ff7a1a}
h1{margin:0;font-size:19px;letter-spacing:.5px}h1 span{color:#ff7a1a}small{color:#8ea0bd}
main{padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;color:#9fb0c8;margin:14px 0 6px}
.kutu{margin-bottom:12px;padding:11px;border-radius:10px;font-size:14px;line-height:1.4}
.bw{background:#5a3a12;border:1px solid #ff7a1a}.br{background:#5c1a22;border:1px solid #e0485a}.bi{background:#16223a;border:1px solid #2a3a58}
.big{display:flex;align-items:center;justify-content:center;width:100%;height:110px;border-radius:16px;background:#ff7a1a;color:#fff;font-size:22px;font-weight:700;margin:0}
.gal{display:block;text-align:center;margin-top:10px;color:#ffb27a;font-size:15px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #2a3a58;background:#16223a;color:#fff;font-size:16px;-webkit-appearance:none}
.row{display:flex;gap:10px}.row>div{flex:1}
.chips{display:flex;gap:8px;margin-top:8px}.chips button{flex:1;padding:9px;border-radius:9px;border:1px solid #2c3f63;background:#1d2b47;color:#e8edf5;font-size:14px}
#ay{margin-top:8px;padding:10px;border-radius:9px;background:#16223a;font-size:14px}#ay b{color:#ff9a4d}.gec{color:#ff8a8a}
#prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}#prev div{position:relative}
#prev img,#prev i{width:76px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #2a3a58;display:flex;align-items:center;justify-content:center;font-style:normal;background:#16223a}
#prev b{position:absolute;top:-6px;right:-6px;background:#7a2430;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px}
button.send{margin-top:20px;width:100%;padding:16px;border-radius:12px;border:none;background:#2e8b57;color:#fff;font-size:18px;font-weight:700}
button.send:disabled{opacity:.5}
#q{display:none;margin-top:10px;width:100%;padding:13px;border-radius:12px;border:1px solid #ff7a1a;background:#2a1f12;color:#ffb27a;font-size:16px}
#msg{margin-top:16px;padding:12px;border-radius:10px;display:none;text-align:center;font-size:16px}
.ok{background:#1f5132}.err{background:#6b1f1f}.inf{background:#1d2b47}
#kurulum{display:none}#kurulum input{margin-top:6px}
#muh{margin:0 0 14px;padding:13px;border-radius:12px;background:#132036;border:1px solid #2e8b57}
#muh.vurgu{border:2px solid #ff7a1a;background:#1d1a12}
#muh h3{margin:0 0 8px;font-size:16px}#muh select{margin-bottom:8px}
#m_durum{font-size:14px;line-height:1.45;color:#cfd8e6;min-height:20px}
#m_btn{margin-top:10px;width:100%;padding:15px;border-radius:12px;border:none;background:#2e8b57;color:#fff;font-size:17px;font-weight:700}
#m_btn:disabled{opacity:.5}#m_sonuc{display:none;margin-top:10px;padding:11px;border-radius:10px;font-size:15px;text-align:center}
a{color:#ffb27a}
</style>
</head>
<body>
<header><h1>SİNETECHNİC <span>GİDER</span></h1><small>Fiş çek → tarihini kontrol et → gönder</small></header>
<main>
<div id="kurulum" class="kutu bw">
  <b>İlk kurulum</b><br>Bu telefon henüz bağlanmamış. PC programında <b>📱 Telefondan Ekle</b> penceresindeki QR kodu okut
  veya anahtarı buraya yapıştır:
  <input id="k_repo" placeholder="kullanici/depo (örn. wolkansezer/sinetechnic-gider-veri)">
  <input id="k_tok" placeholder="GitHub anahtarı (github_pat_…)" autocomplete="off">
  <button class="send" id="k_kaydet" style="margin-top:10px">Kaydet</button>
</div>
<div id="ban" class="kutu" style="display:none"></div>
<div id="muh">
  <h3>📤 Muhasebeciye Gönder</h3>
  <select id="m_ay"></select>
  <div id="m_durum">Yükleniyor…</div>
  <button id="m_btn">📤 Gönder</button>
  <div id="m_sonuc"></div>
</div>
<div id="form">
<label class="big" for="cam">📷 Fiş Fotoğrafı Çek</label>
<input id="cam" type="file" accept="image/*" capture="environment" style="display:none">
<label class="gal" for="gal">🖼 Galeriden / Dosyadan seç (PDF fatura dahil)</label>
<input id="gal" type="file" accept="image/*,application/pdf" multiple style="display:none">
<div id="prev"></div>
<label>Fiş tarihi (fişin üstündeki tarih)</label><input id="tarih" type="date">
<div class="chips"><button type="button" data-d="0">Bugün</button><button type="button" data-d="1">Dün</button><button type="button" data-d="2">2 gün önce</button></div>
<div id="ay"></div>
<label>Tutar (boş bırakırsan program fişten okumaya çalışır)</label><input id="tutar" inputmode="decimal" placeholder="örn. 2500,00">
<div class="row">
  <div><label>Kategori</label><select id="kategori">
    <option value="">Otomatik (fişten)</option><option>Akaryakıt</option><option>Yedek Parça / Malzeme</option><option>Yemek</option><option>Konaklama</option>
    <option>Ulaşım / Otoyol / Otopark</option><option>Telefon / İnternet</option><option>Kırtasiye</option>
    <option>Kargo</option><option>Araç Bakım</option><option>Diğer</option></select></div>
  <div><label>Ödeme</label><select id="odeme"><option>Kredi Kartı</option><option>Banka Kartı</option><option>Nakit</option><option>Havale / EFT</option></select></div>
</div>
<div class="row">
  <div><label>Plaka</label><input id="plaka" placeholder="34 ABC 123" autocapitalize="characters"></div>
  <div><label>Not</label><input id="not" placeholder="isteğe bağlı"></div>
</div>
<button class="send" id="s">☁ Gönder</button>
<button id="q"></button>
<div id="msg"></div>
<p style="text-align:center;margin-top:22px"><small><a href="#" id="cikis">Bu telefonun bağlantısını sıfırla</a></small></p>
</div>
</main>
<script>
var TESLIM = 14;
var AY = ['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'];
var VARSAYILAN_REPO = 'wolkansezer/sinetechnic-gider-veri';
var $ = function (i) { return document.getElementById(i); };
var files = [], kuyruk = [];
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

// ---- kurulum: #r=repo&k=token linkinden veya elle
(function () {
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) { ls('g_tok', h.get('k')); ls('g_repo', h.get('r') || VARSAYILAN_REPO); history.replaceState(null, '', location.pathname); }
})();
function cfg() { return { tok: ls('g_tok') || '', repo: ls('g_repo') || VARSAYILAN_REPO }; }
function kurulumGoster() { var c = cfg(); $('kurulum').style.display = c.tok ? 'none' : 'block'; $('k_repo').value = c.repo; }
$('k_kaydet').onclick = function () { var t = $('k_tok').value.trim(); if (!t) return; ls('g_tok', t); ls('g_repo', $('k_repo').value.trim() || VARSAYILAN_REPO); kurulumGoster(); show('✅ Telefon bağlandı', 'ok'); setTimeout(muhDurum, 300); };
$('cikis').onclick = function (e) { e.preventDefault(); if (confirm('Bu telefondaki GitHub anahtarı silinsin mi?')) { ls('g_tok', null); kurulumGoster(); } };
kurulumGoster();

// ---- tarih ve teslim
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function tr(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear(); }
function bugun() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function teslim(y, m) { return new Date(y, m + 1, TESLIM); }
var ti = $('tarih');
function ayBilgi() {
  var v = ti.value; if (!v) { $('ay').innerHTML = ''; return; }
  var p = v.split('-'), y = +p[0], m = +p[1] - 1, t = teslim(y, m), gec = bugun() > t;
  $('ay').innerHTML = '📁 Bu fiş <b>' + AY[m] + ' ' + y + '</b> dosyasına girer · Muhasebeci teslimi: <b>' + tr(t) + '</b>' +
    (gec ? '<br><span class="gec">⚠ Bu ayın teslim günü geçti — fiş EK belge olarak gönderilecek.</span>' : '');
}
function setGun(n) { var d = bugun(); d.setDate(d.getDate() - n); ti.value = iso(d); ayBilgi(); }
document.querySelectorAll('.chips button').forEach(function (b) { b.onclick = function () { setGun(+b.getAttribute('data-d')); }; });
ti.onchange = ayBilgi; setGun(0);
(function () {
  var b = bugun(); if (b.getDate() > TESLIM) return;
  var pm = new Date(b.getFullYear(), b.getMonth() - 1, 1), t = teslim(pm.getFullYear(), pm.getMonth());
  var kal = Math.round((t - b) / 86400000), e = $('ban');
  e.style.display = 'block'; e.className = 'kutu ' + (kal <= 3 ? 'br' : 'bw');
  e.innerHTML = '⏰ <b>' + AY[pm.getMonth()] + ' ' + pm.getFullYear() + '</b> fişlerinin muhasebeciye son teslim günü <b>' + tr(t) +
    '</b> — ' + (kal === 0 ? '<b>BUGÜN!</b>' : kal + ' gün kaldı.') + ' Geçen aydan kalan fişin varsa tarihini seçip hemen gönder.';
})();

// ---- dosyalar
var pl = ls('gider_plaka'); if (pl) $('plaka').value = pl;
function show(t, c) { var m = $('msg'); m.textContent = t; m.className = c; m.style.display = 'block'; }
function draw() {
  var p = $('prev'); p.innerHTML = '';
  files.forEach(function (f, i) {
    var d = document.createElement('div'), im;
    if (f.type.indexOf('image/') === 0) { im = document.createElement('img'); im.src = URL.createObjectURL(f); }
    else { im = document.createElement('i'); im.textContent = 'PDF'; }
    var x = document.createElement('b'); x.textContent = '×'; x.onclick = function () { files.splice(i, 1); draw(); };
    d.appendChild(im); d.appendChild(x); p.appendChild(d);
  });
}
function add(inp) { for (var i = 0; i < inp.files.length; i++) files.push(inp.files[i]); inp.value = ''; draw(); }
$('cam').onchange = function () { add(this); }; $('gal').onchange = function () { add(this); };
function readB64(blob) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1]); }; r.onerror = no; r.readAsDataURL(blob); }); }
function shrink(file) {
  return new Promise(function (ok) {
    if (file.type.indexOf('image/') !== 0) { ok(file); return; }
    var img = new Image();
    img.onload = function () {
      var M = 2600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, M / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { ok(b || file); }, 'image/jpeg', 0.82);
    };
    img.onerror = function () { ok(file); };
    img.src = URL.createObjectURL(file);
  });
}
function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function bekle(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// ---- GitHub'a yükleme (Contents API)
async function yukle(is) {
  var c = cfg(); if (!c.tok) return 'anahtar';
  var url = 'https://api.github.com/repos/' + c.repo + '/contents/gelen/' + encodeURIComponent(is.ad);
  var gecikme = [0, 1500, 3000, 6000, 10000];
  for (var k = 0; k < gecikme.length; k++) {
    if (gecikme[k]) await bekle(gecikme[k]);
    try {
      var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 60000);
      var r = await fetch(url, {
        method: 'PUT', cache: 'no-store', signal: ctl.signal,
        headers: { 'Authorization': 'Bearer ' + c.tok, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
        body: JSON.stringify({ message: 'fis ' + is.ad.slice(0, 10), content: is.veri })
      });
      clearTimeout(to);
      if (r.status === 201 || r.status === 200 || r.status === 422) return 'ok'; // 422: aynı dosya zaten var
      if (r.status === 401 || r.status === 403 || r.status === 404) return 'yetki';
    } catch (e) { }
  }
  return 'ag';
}
function qKaydet() { try { ls('g_kuyruk', JSON.stringify(kuyruk)); } catch (e) { } }
function qYukle() { try { kuyruk = JSON.parse(ls('g_kuyruk') || '[]'); } catch (e) { kuyruk = []; } }
function qGuncelle() {
  var q = $('q');
  if (kuyruk.length) { q.style.display = 'block'; q.textContent = '↻ Gönderilemeyen ' + kuyruk.length + ' fişi tekrar gönder'; }
  else q.style.display = 'none';
  qKaydet();
}
var calisiyor = false;
async function kuyrukGonder() {
  if (calisiyor || !kuyruk.length) return; calisiyor = true;
  var kalan = [];
  for (var i = 0; i < kuyruk.length; i++) {
    show('Bekleyenler gönderiliyor… ' + (i + 1) + '/' + kuyruk.length, 'inf');
    var s = await yukle(kuyruk[i]); if (s !== 'ok') kalan.push(kuyruk[i]);
  }
  kuyruk = kalan; qGuncelle(); calisiyor = false;
  if (!kuyruk.length) show('✅ Bekleyen fişler gönderildi', 'ok');
  else show('⚠ ' + kuyruk.length + ' fiş hâlâ bekliyor; bağlantı gelince tekrar denenecek.', 'err');
}
$('q').onclick = kuyrukGonder;
window.addEventListener('online', kuyrukGonder);
setInterval(function () { if (kuyruk.length && navigator.onLine) kuyrukGonder(); }, 30000);
qYukle(); qGuncelle(); if (kuyruk.length) setTimeout(kuyrukGonder, 1500);

// ---- muhasebeciye gönderim (GitHub Actions paketi hazırlayıp e-postalar; PC kapalı olabilir)
function gh(yol, ayar) {
  var c = cfg(); ayar = ayar || {};
  var h = { 'Authorization': 'Bearer ' + c.tok, 'X-GitHub-Api-Version': '2022-11-28',
            'Accept': ayar.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json' };
  return fetch('https://api.github.com/repos/' + c.repo + '/contents/' + yol + (ayar.method ? '' : '?t=' + Date.now()),
    { method: ayar.method || 'GET', headers: h, cache: 'no-store', body: ayar.body ? JSON.stringify(ayar.body) : undefined });
}
async function ghJson(yol) { try { var r = await gh(yol, { raw: true }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } }
function tlf(v) { return (v || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL'; }
function ayAd(ym) { var p = ym.split('-'); return AY[+p[1] - 1] + ' ' + p[0]; }
(function () {
  var b = bugun(), sel = $('m_ay');
  for (var i = 0; i < 4; i++) {
    var d = new Date(b.getFullYear(), b.getMonth() - i, 1), ym = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    var o = document.createElement('option'); o.value = ym;
    o.textContent = ayAd(ym) + ' · teslim ' + tr(teslim(d.getFullYear(), d.getMonth()));
    sel.appendChild(o);
  }
  sel.selectedIndex = b.getDate() <= TESLIM ? 1 : 0;
  if (b.getDate() <= TESLIM) $('muh').className = 'vurgu';
  sel.onchange = muhDurum;
})();
var muhSay = 0;
async function muhDurum() {
  if (!cfg().tok) { $('m_durum').textContent = 'Önce telefonu bağla.'; return; }
  var ym = $('m_ay').value, ben = ++muhSay;
  $('m_durum').textContent = 'Durum alınıyor…'; $('m_btn').textContent = '📤 ' + ayAd(ym) + ' fişlerini gönder';
  var k = await ghJson('arsiv/' + ym + '/kayitlar.json') || [];
  var g = await ghJson('arsiv/' + ym + '/gonderim.json') || { gonderimler: [] };
  var bekl = 0;
  try { var r = await gh('gelen'); if (r.ok) (await r.json()).forEach(function (f) { if (f.name.indexOf(ym) === 0) bekl++; }); } catch (e) { }
  if (ben !== muhSay) return;
  var gid = {}; g.gonderimler.forEach(function (x) { (x.kayit_idler || []).forEach(function (i) { gid[i] = 1; }); });
  var top = 0, gonm = 0, gonmTop = 0;
  k.forEach(function (x) { top += x.tutar || 0; if (!x.gonderildi && !gid[x.id]) { gonm++; gonmTop += x.tutar || 0; } });
  var son = g.gonderimler.length ? g.gonderimler[g.gonderimler.length - 1] : null;
  var h = '<b>' + k.length + '</b> fiş işlendi (' + tlf(top) + ')';
  h += '<br>Gönderilmemiş: <b>' + (gonm + bekl) + '</b>' + (bekl ? ' (' + bekl + ' tanesi henüz PC\'ye inmedi, yine de gönderilir)' : '');
  if (son) h += '<br>Son gönderim: ' + son.zaman.replace('T', ' ').slice(0, 16) + (son.ek_no ? ' (EK ' + son.ek_no + ')' : '') + ' · ' + son.adet + ' belge';
  $('m_durum').innerHTML = h;
  $('m_btn').disabled = (gonm + bekl) === 0;
  if ((gonm + bekl) === 0) $('m_btn').textContent = '✅ Gönderilecek yeni fiş yok';
}
function mSonuc(t, c) { var e = $('m_sonuc'); e.textContent = t; e.className = c; e.style.display = 'block'; }
$('m_btn').onclick = async function () {
  var ym = $('m_ay').value;
  if (!confirm(ayAd(ym) + ' fişleri muhasebeciye e-postayla gönderilsin mi?')) return;
  var ad = 'gonder-' + ym + '-' + Date.now() + '.json';
  this.disabled = true; mSonuc('Gönderim başlatılıyor…', 'inf');
  try {
    var icerik = btoa(unescape(encodeURIComponent(JSON.stringify({ ay: ym, zaman: new Date().toISOString() }))));
    var r = await gh('komut/' + ad, { method: 'PUT', body: { message: 'gonder ' + ym, content: icerik } });
    if (!r.ok) { mSonuc('⚠ Komut gönderilemedi (' + r.status + ')', 'err'); this.disabled = false; return; }
  } catch (e) { mSonuc('⚠ Bağlantı hatası, tekrar dene', 'err'); this.disabled = false; return; }
  var bas = Date.now();
  while (Date.now() - bas < 10 * 60000) {
    var sn = Math.round((Date.now() - bas) / 1000);
    mSonuc('⏳ Paket hazırlanıyor ve gönderiliyor… ' + sn + ' sn (genelde 2–4 dk sürer, sayfayı kapatabilirsin)', 'inf');
    await bekle(10000);
    var s = await ghJson('komut_sonuc/' + ad);
    if (s) { mSonuc((s.ok ? '✅ ' : '⚠ ') + s.mesaj, s.ok ? 'ok' : 'err'); muhDurum(); return; }
  }
  mSonuc('Sonuç henüz gelmedi. Biraz sonra sayfayı yenileyip "Son gönderim" satırına bak.', 'err');
  muhDurum();
};
if (cfg().tok) muhDurum();

$('s').onclick = async function () {
  if (!cfg().tok) { kurulumGoster(); show('Önce telefonu bağla (üstteki kurulum)', 'err'); return; }
  if (!files.length) { show('Önce fiş fotoğrafı çek', 'err'); return; }
  if (!ti.value) { show('Fiş tarihini seç', 'err'); return; }
  var meta = {
    tutar: $('tutar').value, kategori: $('kategori').value, odeme: $('odeme').value,
    plaka: $('plaka').value.toUpperCase(), not: $('not').value, tarih: ti.value, tarih_kesin: (ti.value !== iso(bugun()))
  };
  ls('gider_plaka', meta.plaka);
  var btn = $('s'); btn.disabled = true; var ok = 0, n = files.length, yetki = false;
  for (var i = 0; i < n; i++) {
    show('Gönderiliyor… ' + (i + 1) + '/' + n, 'inf');
    try {
      var f = files[i], pdf = (f.type === 'application/pdf'), b = await shrink(f);
      var is = { ad: meta.tarih + '__' + Date.now() + Math.random().toString(36).slice(2, 6) + '__' + b64url(JSON.stringify(meta)) + (pdf ? '.pdf' : '.jpg'), veri: await readB64(b) };
      var s = await yukle(is);
      if (s === 'ok') ok++; else { if (s === 'yetki') yetki = true; kuyruk.push(is); }
    } catch (e) { }
  }
  btn.disabled = false; files = []; draw(); qGuncelle(); ['tutar', 'not'].forEach(function (k) { $(k).value = ''; });
  if (ok === n) show('✅ ' + ok + ' belge gönderildi (' + meta.tarih.split('-').reverse().join('.') + ')', 'ok');
  else if (yetki) show('⚠ GitHub anahtarı geçersiz veya yetkisiz. Bağlantıyı sıfırlayıp QR kodu tekrar okut.', 'err');
  else show('⚠ ' + ok + '/' + n + ' gönderildi. Kalanlar telefonda bekliyor; bağlantı gelince otomatik gönderilecek.', 'err');
};
