name: Windows EXE

on:
  push:
    branches: [main]
    paths: ["gider.py", "assets/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketler
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 openpyxl Pillow reportlab qrcode pypdf pillow-heif pyinstaller winocr
      - name: EXE derle
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "SINETECHNIC_GIDER" --icon assets/icon.ico --add-data "assets;assets" --collect-all winocr --collect-all winrt --collect-all pillow_heif gider.py
      - uses: actions/upload-artifact@v4
        with:
          name: SINETECHNIC_GIDER
          path: dist/SINETECHNIC_GIDER.exe
      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: SİNETECHNİC GİDER v1.1.${{ github.run_number }}
          files: dist/SINETECHNIC_GIDER.exe
