name: Windows EXE

on:
  push:
    branches: [main]
    paths: ["gider.py", "assets/**", "tests/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketler
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 openpyxl Pillow reportlab qrcode pypdf pillow-heif pyinstaller winocr opencv-python-headless rapidocr_onnxruntime pypdfium2
      - name: OCR testi
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/ocr_test.py
      - name: EXE derle
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "SINETECHNIC_GIDER" --icon assets/icon.ico --add-data "assets;assets" --collect-all winocr --collect-all winrt --collect-all pillow_heif --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-submodules cv2 --collect-all pypdfium2 --collect-all pypdfium2_raw gider.py
      - name: EXE içinde OCR testi
        shell: pwsh
        run: |
          Start-Process -FilePath dist/SINETECHNIC_GIDER.exe -ArgumentList "--ocr-test","tests/ornek_fis.jpg","exe_ocr.txt" -Wait
          Get-Content exe_ocr.txt
          if (-not (Select-String -Path exe_ocr.txt -Pattern '"tutar": 320.0' -Quiet)) { throw "EXE OCR testi basarisiz" }
      - uses: actions/upload-artifact@v4
        with:
          name: SINETECHNIC_GIDER
          path: dist/SINETECHNIC_GIDER.exe
      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.${{ github.run_number }}
          name: SİNETECHNİC GİDER v1.6.${{ github.run_number }}
          files: dist/SINETECHNIC_GIDER.exe
